<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="技術架構：使用者經網頁前端提供影片與地點，外部 Google 衛星圖與 Gemini 去車產出底圖，重建管線做校正、偵測、定位、軌跡整理，打包成場景包，由 Three.js 在瀏覽器內模擬重演並回到使用者" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif'>
