<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="系統架構：地點與監視影片兩條資料，經空間對位與車輛軌跡還原，在場景合成匯流，產出瀏覽器 3D 重演" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif'>
