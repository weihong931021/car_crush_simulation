<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>底圖工作台</title>
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#FFFFFF; --line:#DDE3E9;
    --ink:#1A2430; --dim:#69798A; --teal:#0E8C7E; --teal-ink:#0B7A6D;
    --tape:#C88A00; --bad:#C3402A; --ok:#0E7A52;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
  button{font:600 14px var(--sans);cursor:pointer;border:1px solid transparent;border-radius:8px}
  button:disabled{opacity:.35;cursor:not-allowed}
  input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  header{display:flex;align-items:center;gap:22px;padding:16px 26px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.06em}
  .steps{display:flex;gap:20px;font-size:13px;color:var(--dim)}
  .steps span{position:relative;padding-left:19px}
  .steps span::before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;
    border-radius:50%;border:1.5px solid var(--line)}
  .steps span.on{color:var(--ink)}
  .steps span.on::before{background:var(--teal);border-color:var(--teal)}
  .steps span.done::before{background:var(--teal-ink);border-color:var(--teal-ink)}
  header{background:var(--panel)}

  main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 58px)}
  @media (max-width:880px){main{grid-template-columns:1fr}}
  aside{padding:22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
  section h2{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

  label{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
  input[type=text]{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font:13px var(--mono)}
  input[type=text]::placeholder{color:#A6B2BE}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
  .fld{position:relative;margin-top:10px}
  .file{display:block;margin-top:12px;padding:9px 10px;border:1px dashed var(--line);border-radius:7px;
    color:var(--dim);font-size:12.5px;text-align:center;cursor:pointer}
  .file:hover{border-color:var(--teal);color:var(--ink)}
  .file input{display:none}

  .go{width:100%;margin-top:14px;padding:11px;background:var(--teal);color:#fff}
  .go:hover:not(:disabled){background:var(--teal-ink)}
  .ghost{padding:9px 13px;background:transparent;border-color:var(--line);color:var(--ink)}
  .ghost:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
  .cta{width:100%;padding:12px;background:var(--tape);color:#fff}
  .cta:hover:not(:disabled){background:#B07800}

  .msg{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--dim);min-height:18px}
  .msg.busy::before{content:"";display:inline-block;width:9px;height:9px;margin-right:7px;
    border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.msg.busy::before{animation:none}}
  .alert{margin-top:10px;padding:9px 11px;border-radius:7px;font-size:12.5px;line-height:1.5}
  .alert.bad{background:#FDECE8;color:var(--bad);border:1px solid rgba(195,64,42,.28)}
  .alert.ok{background:#E6F6EF;color:var(--ok);border:1px solid rgba(14,122,82,.28)}
  .alert code{font:11.5px var(--mono);background:rgba(26,36,48,.07);padding:1px 4px;border-radius:3px}

  .sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(26,36,48,.14);
    max-height:220px;overflow-y:auto}
  .sugg[hidden]{display:none}
  .sugg button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:8px 10px;
    background:transparent;border:0;border-radius:0;color:var(--ink);font:400 12px var(--mono);white-space:nowrap}
  .sugg button + button{border-top:1px solid var(--line)}
  .sugg button:hover,.sugg button.active{background:#E4F5F2}
  .sugg b{font:600 12.5px var(--sans);min-width:11ch;overflow:hidden;text-overflow:ellipsis}
  .sugg i{font-style:normal;color:var(--dim)}
  .sugg i.hit{color:var(--teal)}

  .stage{position:relative;display:flex;align-items:center;justify-content:center;padding:26px 26px 88px;
    background:var(--bg)}
  canvas{max-width:100%;max-height:calc(100vh - 200px);border-radius:10px;display:block;
    box-shadow:0 6px 24px rgba(26,36,48,.14)}
  .blank{color:var(--dim);font-size:14px}
  .bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;
    padding:14px 26px;border-top:1px solid var(--line);background:var(--panel)}
  .bar[hidden]{display:none}
  .bar input[type=range]{flex:1;accent-color:var(--tape);min-width:110px}
  .num{font:600 15px var(--mono);min-width:5ch;text-align:right}
  .facts{font:12px var(--mono);color:var(--dim);min-width:20ch}
  .extras{display:flex;gap:8px}
  .extras button{padding:7px 11px;font-size:12.5px;background:transparent;border-color:var(--line);color:var(--dim)}
  .extras button:hover:not(:disabled){color:var(--ink);border-color:var(--teal)}
  .extras button.on{color:var(--teal);border-color:var(--teal)}
</style>
</head>
<body>
<header>
  <h1>底圖工作台</h1>
  <div class="steps">
    <span id="st1" class="on">選地點</span><span id="st2">框範圍</span><span id="st3">標註</span>
  </div>
</header>

<main>
  <aside>
    <section>
      <h2>地點</h2>
      <div class="pair">
        <div><label for="lat">緯度</label>
          <input id="lat" type="text" inputmode="decimal" placeholder="23.026901" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="sg-ll"></div>
        <div><label for="lon">經度</label>
          <input id="lon" type="text" inputmode="decimal" placeholder="120.249615" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="sg-ll"></div>
        <div class="sugg" id="sg-ll" role="listbox" hidden></div>
      </div>
      <div class="fld"><label for="code">代號</label>
        <input id="code" type="text" placeholder="tainan_yongkang" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="sg-code">
        <div class="sugg" id="sg-code" role="listbox" hidden></div></div>
      <label class="file" id="fileLabel" for="video"><span>＋ 事故影片（選配，抽首幀當 CCTV）</span>
        <input id="video" type="file" accept=".mp4,.mov,.png,.jpg,.jpeg"></label>
      <button id="go" class="go">擷取底圖</button>
      <div id="msg" class="msg"></div>
      <div id="alerts"></div>
    </section>

    <section id="handoffSec" hidden>
      <h2>下一步</h2>
      <button id="handoff" class="cta">開始標註對應點 →</button>
      <div id="handoffNote"></div>
    </section>
  </aside>

  <div class="stage">
    <div class="blank" id="blank">填經緯度後按「擷取底圖」</div>
    <canvas id="cv" width="900" height="900" hidden></canvas>
    <div class="bar" id="bar" hidden>
      <label for="size" style="margin:0">範圍</label>
      <input id="size" type="range" min="10" max="44" step="1" value="35">
      <span class="num" id="num">35 m</span>
      <span class="facts" id="facts"></span>
      <button id="lock" class="ghost">鎖定範圍</button>
      <div class="extras" id="extras" hidden>
        <button id="decarBtn" title="Gemini 偵測 + inpaint 去除路上車輛（選配）">去車</button>
        <button id="genaiBtn" title="生圖模型重畫路面：好看但幾何位移 0.2 m，不可用於標註">AI 高清</button>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const S = { code:null, meta:null, variants:{}, coverage:0, tab:null, img:null, upload:null };

const msg = (t, busy) => { $("msg").textContent = t; $("msg").className = "msg" + (busy ? " busy" : ""); };
const alert_ = (kind, html) => $("alerts").innerHTML = html ? `<div class="alert ${kind}">${html}</div>` : "";

async function api(path, body){
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- 歷史（localStorage，最多 8 筆）---------- */
const HK = "satpipe.history";
const hLoad = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch { return []; } };
function hAdd(lat, lon, code){
  const h = hLoad().filter(e => e.code !== code);
  h.unshift({ lat, lon, code });
  localStorage.setItem(HK, JSON.stringify(h.slice(0, 8)));
}

function suggest(inputId, boxId){
  const input = $(inputId), box = $(boxId);
  let items = [], act = -1;
  const close = () => { box.hidden = true; input.setAttribute("aria-expanded","false"); act = -1; };
  const pick = e => { $("lat").value = e.lat; $("lon").value = e.lon; $("code").value = e.code;
                      close(); msg(`已帶入 ${e.code}`); };
  const paint = () => box.querySelectorAll("button").forEach((b,i) => b.classList.toggle("active", i === act));
  function open(){
    const q = input.value.trim().toLowerCase();
    items = hLoad().filter(e => !q || String(e[inputId]).toLowerCase().startsWith(q)
                                  || e.code.toLowerCase().includes(q));
    if(!items.length) return close();
    box.innerHTML = items.map((e,i) => {
      const f = k => `<i class="${k === inputId && q ? "hit" : ""}">${e[k]}</i>`;
      return `<button type="button" role="option" data-i="${i}"><b>${e.code}</b>${f("lat")}${f("lon")}</button>`;
    }).join("");
    box.querySelectorAll("button").forEach(b =>
      b.onmousedown = ev => { ev.preventDefault(); pick(items[+b.dataset.i]); });
    box.hidden = false; input.setAttribute("aria-expanded","true"); act = -1;
  }
  input.addEventListener("focus", open);
  input.addEventListener("input", open);
  input.addEventListener("blur", () => setTimeout(close, 130));
  input.addEventListener("keydown", ev => {
    if(box.hidden) return;
    if(ev.key === "ArrowDown"){ ev.preventDefault(); act = (act+1) % items.length; paint(); }
    else if(ev.key === "ArrowUp"){ ev.preventDefault(); act = (act-1+items.length) % items.length; paint(); }
    else if(ev.key === "Enter" && act >= 0){ ev.preventDefault(); pick(items[act]); }
    else if(ev.key === "Escape") close();
  });
}

/* ---------- 幾何：與後端 px_per_meter / best_zoom_for_size 同一條式子 ---------- */
const ppmAt = (lat, z) => 2 * Math.pow(2, z) / (156543.03392 * Math.cos(lat * Math.PI/180));
const bestZoom = (lat, m) => [21,20,19].find(z => 1280 / ppmAt(lat, z) >= m) ?? 19;

/* ---------- 擷取 ---------- */
$("go").onclick = () => capture();

async function capture(zoom){
  const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value), code = $("code").value.trim();
  if(!isFinite(lat) || !isFinite(lon)) return msg("緯度／經度要是數字");
  if(!/^[A-Za-z0-9_-]+$/.test(code)) return msg("代號只能用英數、-、_");
  $("go").disabled = true; alert_("", "");
  msg(zoom ? `以 zoom ${zoom} 重抓…` : "擷取衛星圖…", true);
  try{
    const st = await api("/api/capture", { lat, lon, code, zoom });
    hAdd(lat, lon, code);
    apply(st);
    msg("拖滑桿框出範圍，再按鎖定");
  }catch(e){ msg("失敗：" + e.message); }
  finally{ $("go").disabled = false; }
}

function apply(st){
  Object.assign(S, { code:st.code, meta:st.meta, variants:st.variants, coverage:st.coverage_m });
  const locked = !!st.meta.locked;
  $("st1").className = "done";
  $("st2").className = locked ? "done" : "on";
  $("st3").className = locked ? "on" : "";
  $("blank").hidden = true; $("cv").hidden = false; $("bar").hidden = false;

  const s = $("size");
  s.max = Math.max(Math.floor(st.coverage_m), Math.ceil(st.meta.size_m || 0));
  s.disabled = locked;
  if(locked) s.value = st.meta.size_m; else if(+s.value > +s.max) s.value = s.max;
  $("lock").disabled = locked;
  $("lock").textContent = locked ? "已鎖定" : "鎖定範圍";
  $("extras").hidden = !locked;
  $("handoffSec").hidden = !locked;

  // 只在真的有問題時說話：該 zoom 沒有實際影像（Google 拿低 zoom 放大充數）
  alert_("bad", st.meta.detail_ok === false
    ? `此處沒有 zoom ${st.meta.zoom} 的實際影像（細節 ${st.meta.detail_score}，正常約 120）——`
      + `這是低 zoom 放大的糊圖，請確認經緯度。`
    : "");

  const names = Object.keys(st.variants);
  $("decarBtn").classList.toggle("on", st.meta.decar_status === "ok");
  $("genaiBtn").classList.toggle("on", names.includes("sat_genai.png"));
  show(names.includes("sat_clean.png") ? "sat_clean.png" : names[0]);
}

function show(name){
  S.tab = name;
  const im = new Image();
  im.onload = () => { S.img = im; draw(); };
  im.src = S.variants[name].url;
}

/* ---------- 畫面 ---------- */
$("size").oninput = draw;

function draw(){
  const cv = $("cv"), ctx = cv.getContext("2d"), W = cv.width;
  const size = +$("size").value, m = S.meta, locked = !!m.locked;
  $("num").textContent = size + " m";
  if(!S.img) return;

  ctx.clearRect(0, 0, W, W);
  ctx.drawImage(S.img, 0, 0, W, W);

  const frac = locked ? 1 : Math.min(1, size / S.coverage), side = W * frac, off = (W - side) / 2;
  if(!locked){
    ctx.fillStyle = "rgba(244,246,248,.72)";
    ctx.fillRect(0,0,W,off); ctx.fillRect(0,off+side,W,off);
    ctx.fillRect(0,off,off,side); ctx.fillRect(off+side,off,off,side);
  }
  ctx.strokeStyle = locked ? "#0E8C7E" : "#C88A00";
  ctx.lineWidth = 2; ctx.strokeRect(off+1, off+1, side-2, side-2);
  ctx.lineWidth = 5;
  [[off,off,1,1],[off+side,off,-1,1],[off,off+side,1,-1],[off+side,off+side,-1,-1]].forEach(([x,y,dx,dy]) => {
    ctx.beginPath(); ctx.moveTo(x, y+dy*24); ctx.lineTo(x, y); ctx.lineTo(x+dx*24, y); ctx.stroke();
  });

  // 一行事實：鎖定後實際會拿到什麼（後端會自動升到裝得下的最高 zoom）
  const z = locked ? m.zoom : bestZoom(m.lat, size);
  const pm = locked ? m.px_per_meter : ppmAt(m.lat, z);
  $("facts").textContent = `zoom ${z} · ${pm.toFixed(1)} px/m · ${Math.round(size * pm)} px`;
}

/* ---------- 動作 ---------- */
$("lock").onclick = async () => {
  const size = +$("size").value;
  $("lock").disabled = true; msg("裁切並鎖定…", true);
  try{
    const st = await api("/api/lock", { code:S.code, size_m:size });
    apply(st);
    msg(st.zoom_upgraded ? `已鎖定（自動升到 zoom ${st.zoom_upgraded.to}，解析度加倍）`
                         : "已鎖定，可以交付標註");
  }catch(e){ msg("鎖定失敗：" + e.message); $("lock").disabled = false; }
};

$("decarBtn").onclick = async () => {
  $("decarBtn").disabled = true; msg("Gemini 偵測車輛並去除…", true);
  try{ apply(await api("/api/enhance", { code:S.code, decar:true })); msg("去車完成"); }
  catch(e){ msg("去車失敗：" + e.message); }
  finally{ $("decarBtn").disabled = false; }
};

$("genaiBtn").onclick = async () => {
  $("genaiBtn").disabled = true; msg("生圖高清化…（約 25 秒）", true);
  try{
    apply(await api("/api/genai", { code:S.code }));
    show("sat_genai.png");
    alert_("bad", "AI 高清版是<strong>重畫</strong>的，幾何位移約 0.2 m——只能當展示底圖，"
      + "交付標註仍會用忠實版。");
  }catch(e){ msg("生圖失敗：" + e.message); }
  finally{ $("genaiBtn").disabled = false; }
};

/* ---------- 影片 ---------- */
$("video").onchange = async () => {
  const f = $("video").files[0]; S.upload = null;
  const label = $("fileLabel").querySelector("span");
  if(!f) return;
  const code = $("code").value.trim();
  if(!/^[A-Za-z0-9_-]+$/.test(code)){ msg("先填代號再選影片"); $("video").value = ""; return; }
  label.textContent = `上傳 ${f.name}…`;
  try{
    const r = await fetch(`/api/upload?code=${encodeURIComponent(code)}&name=${encodeURIComponent(f.name)}`,
                          { method:"POST", body:f });
    const j = await r.json(); if(!r.ok) throw new Error(j.error);
    S.upload = j;
    label.textContent = `✓ ${j.name}`;
  }catch(e){ label.textContent = "＋ 事故影片（上傳失敗）"; msg(e.message); }
};

/* ---------- 交付 ---------- */
$("handoff").onclick = async () => {
  // 交付是實作細節，不用讓使用者知道「送進 trafficlab」這件事——按下去就進標註頁
  $("handoff").disabled = true; msg("準備標註畫面…", true);
  const body = { code:S.code };
  if(S.upload) body[S.upload.kind] = S.upload.name;
  try{
    await send(body);
    location.href = `/annotate?code=${encodeURIComponent(S.code)}`;
  }catch(e){ msg(e.message === "已取消" ? "已取消" : "失敗：" + e.message); $("handoff").disabled = false; }
};

async function send(body){
  try{ return await api("/api/handoff", body); }
  catch(e){
    if(!/G_projection/.test(e.message)) throw e;
    if(!confirm("這個地點已經標註過，重新開始會讓既有座標失效。要繼續嗎？")) throw new Error("已取消");
    return api("/api/handoff", { ...body, force:true });
  }
}

suggest("lat", "sg-ll"); suggest("lon", "sg-ll"); suggest("code", "sg-code");
</script>
</body>
</html>
